<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202225">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/extras.css">
    <link rel="icon" href="./images/porton.jpg" />
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Jeopardy - UTH</title>
</head>

<body>

    <div class="container">

        <div id="introScreen">
            <div class="curtain curtain-left"></div>
            <div class="curtain curtain-right"></div>
            <h1 class="intro-title">¡Bienvenidos a Jeopardy UTH!</h1>
        </div>

        <!-- BARRA DE CONTROL (solo admin) -->
        <div class="mode-controls-panel admin-only" role="toolbar" aria-label="Controles del juego">
            <button id="modeGameBtn" class="mode-btn active" data-action="mode-game">Modo Juego</button>
            <button id="modeEditBtn" class="mode-btn" data-action="mode-edit">Modo Edición</button>
            <button id="musicBtn" class="mode-btn" data-action="toggle-music">🎵 Reproducir Música</button>
            <div id="volumeContainer" style="display:none; align-items:center; gap:8px;">
                <label for="musicVolume" style="color:var(--text-muted); font-size:0.82rem;">🔊</label>
                <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.35"
                    style="width:90px; cursor:pointer; accent-color: var(--accent-blue);">
            </div>
            <button id="undoBtn" class="mode-btn" data-action="undo" disabled title="Ctrl+Z">↩️ Deshacer</button>
            <button class="mode-btn" data-action="open-settings">⚙️ Ajustes</button>
            <button class="mode-btn" data-action="open-podium">🏆 Finalizar</button>
            <button class="mode-btn" data-action="open-announcer">📺 Abrir anunciador</button>
            <button id="buzzerBtn" class="mode-btn" data-action="open-buzzer">📱 Buzzers</button>
            <span id="announcerStatus" class="announcer-status">📺 Sin anunciador</span>
            <button class="mode-btn" data-action="show-help" title="Atajos de teclado" aria-label="Atajos de teclado">⌨️</button>
            <button id="toggleUiBtn" class="mode-btn" data-action="toggle-ui">Ocultar UI</button>
        </div>

        <!-- HEADER -->
        <div class="header">
            <div style="display:flex; align-items:center; justify-content:center; gap:20px;">
                <img src="./images/señalando.png" style="height:5em; transform:scaleX(-1);" alt="">
                <h1>Concursillo - UTH Edition</h1>
                <img src="./images/señalando.png" style="height:5em;" alt="">
            </div>
        </div>

        <!-- ACCIONES (modo edición, solo admin) -->
        <div class="controls-panel admin-only">
            <div class="actions-list" id="actionsDropdown">
                <button class="action-btn" data-action="add-player">➕ Agregar Jugador</button>
                <button class="action-btn" data-action="create-team">👥 Crear Equipo</button>
                <button class="action-btn" data-action="edit-questions">✏️ Editar Preguntas</button>
                <button class="action-btn" data-action="new-round">🆕 Nueva Ronda</button>
                <button class="action-btn" data-action="duplicate-round">📄 Duplicar Ronda</button>
                <button class="action-btn" data-action="delete-round">🗑️ Eliminar Ronda</button>
                <button class="action-btn" data-action="reset-scores">🔄 Reiniciar Puntos</button>
                <button class="action-btn" data-action="reset-questions">❌ Reiniciar Preguntas</button>
                <button class="action-btn" data-action="export-json">📦 Exportar JSON</button>
                <button class="action-btn" data-action="import-json">📥 Importar JSON</button>
                <button class="action-btn" data-action="export-csv">📄 Exportar CSV</button>
                <button class="action-btn" data-action="import-csv">📥 Importar CSV</button>
                <button class="action-btn" data-action="csv-template">🧾 Plantilla CSV</button>
            </div>
        </div>

        <!-- MODO JUEGO -->
        <div id="gameModeContainer" class="mode-content">
            <div class="scoreboard" id="scoreboard"></div>
            <div class="board" id="board"></div>
        </div>

        <!-- MODO EDICIÓN (solo admin) -->
        <div id="editModeContainer" class="mode-content admin-only" style="display:none;">
            <h2 style="text-align:center;">Opciones de Ronda</h2>
            <p class="edit-info">Seleccioná la ronda para ver/editar su tablero de preguntas.</p>
            <div class="tabs-container" id="tabsContainer"></div>
        </div>

    </div>

    <!-- ═══════════════════════════════════
         MODAL DE PREGUNTA (admin y anunciador)
    ═══════════════════════════════════ -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Pregunta">
        <div class="modal-content">
            <div class="modal-main">

                <h2 id="categoryTitle"></h2>
                <div class="value" id="pointValue"></div>

                <div class="timer-box" id="timerBox" aria-live="off">
                    <span id="timerText"></span>
                    <div class="timer-track"><div id="timerBar" class="timer-fill"></div></div>
                </div>

                <div class="dd-banner" id="ddBanner">🎲 DAILY DOUBLE 🎲</div>
                <div class="bet-panel" id="betPanel"></div>

                <div class="question" id="questionText"></div>

                <div class="responder-banner" id="responderBanner" aria-live="polite"></div>

                <div class="multiple-choice-container" id="multipleChoiceContainer">
                    <h3 style="text-align:center; margin-bottom:10px;">Opciones</h3>
                    <div class="multiple-choice-grid" id="multipleChoiceText"></div>
                </div>

                <div class="answer" id="answerText"></div>
                <div class="admin-answer admin-only" id="adminAnswer"></div>

                <!-- Botones (solo admin) -->
                <div class="buttons-top admin-only">
                    <button id="btnShowOptions" class="btn btn-pistas" data-action="q-options">Ver Pistas (50%)</button>
                    <button id="btnShowAnswer" class="btn" data-action="q-answer">Mostrar Respuesta</button>
                    <button id="btnTimerToggle" class="btn" data-action="q-timer-toggle">⏱ Iniciar timer</button>
                    <button id="btnTimerReset" class="btn" data-action="q-timer-reset" title="Reiniciar timer">↺</button>
                    <button id="btnBuzzOpen" class="btn" data-action="q-buzz-open" style="display:none" title="Atajo: B">🔔 Abrir buzzers</button>
                    <button id="toggleRouletteBtn" class="btn btn-roulette" data-action="q-roulette">Mostrar Ruleta</button>
                    <button class="btn" data-action="q-none" title="Atajo: N">Nadie acertó</button>
                    <button class="btn danger" data-action="q-close" title="Atajo: Esc">Cerrar</button>
                </div>

                <!-- Ruleta (se ve en ambas vistas) -->
                <div id="rouletteWrapper" class="roulette-wrapper hidden">
                    <div class="roulette-container">
                        <div class="roulette-pointer"></div>
                        <div class="roulette-wheel" id="rouletteWheel"></div>
                        <button class="roulette-btn admin-only" id="spinRouletteBtn" data-action="q-spin">🎰 Elegir quién juega</button>
                    </div>
                </div>

                <div class="players-area" id="playersArea"></div>

            </div>

            <div class="presenter-container">
                <img src="./images/leyendo.png" class="presenter-img" alt="Presentadora">
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════
         EDITOR (solo admin)
    ═══════════════════════════════════ -->
    <div class="editor-modal admin-only" id="editorModal" role="dialog" aria-modal="true" aria-label="Editor de ronda">
        <div class="editor-content">
            <h2 id="editorTitle">Editor de Juego</h2>
            <div class="editor-round-meta">
                <label>Nombre de la ronda
                    <input type="text" id="roundName" data-field="roundName" maxlength="60">
                </label>
                <label>Modo
                    <select id="roundMode" data-field="roundMode">
                        <option value="individual">Individual (jugadores)</option>
                        <option value="team">Grupal (equipos)</option>
                    </select>
                </label>
            </div>
            <div class="editor-toolbar">
                <button class="add-category-btn" data-action="ed-add-category">+ Agregar Categoría</button>
                <button class="mini-btn" data-action="ed-random-dd">🎲 Daily Double al azar</button>
            </div>
            <div id="categoriesEditor"></div>
            <div class="editor-actions">
                <button class="btn btn-save" data-action="ed-save">Guardar Cambios</button>
                <button class="btn danger btn-cancel" data-action="ed-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ⚡ RONDA RELÁMPAGO -->
    <div class="modal" id="lightningModal"></div>

    <!-- 🏆 PODIO -->
    <div class="modal" id="podiumModal"></div>

    <!-- AUDIO -->
    <audio id="rouletteTick" src="./audio/ruleta.mp3" preload="auto"></audio>
    <audio id="gameMusic" src="./audio/Música preguntas 1 - 5 (Quien Quiere ser millonario).mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
