<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/svg+xml" href="./images/porton.jpg" />
    <link rel="icon" href="./images/porton.jpg" />
    <title>Jeopardy - UTH</title>
</head>

<body>

    <div class="container">

        <div id="introScreen">
            <div class="curtain curtain-left"></div>
            <div class="curtain curtain-right"></div>
            <h1 class="intro-title">¡Bienvenidos a Jeopardy UTH!</h1>
        </div>

        <!-- BARRA DE MODOS -->
        <div class="mode-controls-panel">
            <button id="modeGameBtn" class="mode-btn active" onclick="game.setMode('game')">Modo Juego</button>
            <button id="modeEditBtn" class="mode-btn" onclick="game.setMode('edit')">Modo Edición</button>
            <!-- <div class="mode-btn-separator"></div> -->
            <button id="musicBtn" class="mode-btn" onclick="game.toggleMusic()">🎵 Música</button>
            <div id="volumeContainer" style="display:none; align-items:center; gap:8px;">
                <label for="musicVolume" style="color:var(--text-muted); font-size:0.82rem;">🔊</label>
                <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="0.5"
                    style="width:90px; cursor:pointer; accent-color: var(--accent-blue);">
            </div>
            <button id="openRouletteGlobalBtn" class="mode-btn">
                Ruleta
            </button>
            <button id="toggleUiBtn" class="mode-btn" onclick="game.toggleUI()">
                Ocultar UI
            </button>
        </div>

        <div id="rouletteGlobalWrapper" class="roulette-wrapper hidden">
            <div class="roulette-container">
                <div class="roulette-pointer"></div>
                <div class="roulette-wheel" id="rouletteWheel"></div>
                <button class="roulette-btn" id="spinRouletteBtn">
                    Girar
                </button>
            </div>
        </div>

        <!-- HEADER -->
        <div class="header">
            <div style="display:flex; align-items:center; justify-content:center; gap:20px;">
                <img src="./images/señalando.png" style="height:5em; transform:scaleX(-1);" alt="">
                <h1>Concursillo - UTH Edition</h1>
                <img src="./images/señalando.png" style="height:5em;" alt="">
            </div>
            <p class="header-credits">Desarrollado por <span class="credits-name">Nahuel Soria Parodi</span></p>
        </div>


        <!-- ACCIONES -->
        <div class="controls-panel">
            <div class="actions-list" id="actionsDropdown">
                <button class="action-btn" onclick="game.playerManager.add()">➕ Agregar Jugador</button>
                <button class="action-btn" onclick="game.teamManager.create()">👥 Crear Equipo</button>
                <!-- <button class="action-btn lr-action-btn" onclick="game.lightningRound.open()">⚡ Ronda Relámpago</button> -->
                <button class="action-btn" onclick="game.editor.open()">✏️ Editar Preguntas</button>
                <button class="action-btn" onclick="game.pointsManager.resetScores()">🔄 Reiniciar Puntos</button>
                <button class="action-btn" onclick="game.pointsManager.resetQuestions()">❌ Reiniciar Preguntas</button>
            </div>
        </div>

        <!-- MODO JUEGO -->
        <div id="gameModeContainer" class="mode-content">
            <div class="scoreboard" id="scoreboard"></div>
            <div class="board" id="board"></div>
            <div id="finalQuestionText"></div>
            <div id="finalQuestionValue"></div>
        </div>

        <!-- MODO EDICIÓN -->
        <div id="editModeContainer" class="mode-content" style="display:none;">
            <h2 style="text-align:center;">Opciones de Ronda</h2>
            <p class="edit-info">Seleccioná la ronda para ver/editar su tablero de preguntas.</p>
            <div class="tabs-container" id="tabsContainer"></div>
        </div>

    </div>

    <!-- ═══════════════════════════════════
         MODAL DE PREGUNTA
    ═══════════════════════════════════ -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-main">

                <!-- Categoría y puntos -->
                <h2 id="categoryTitle"></h2>
                <div class="value" id="pointValue"></div>

                <!-- Pregunta -->
                <div class="question" id="questionText"></div>

                <!-- Opciones múltiples -->
                <div class="multiple-choice-container" id="multipleChoiceContainer">
                    <h3 style="text-align:center; margin-bottom:10px;">Opciones</h3>
                    <div class="multiple-choice-grid" id="multipleChoiceText"></div>
                </div>

                <!-- Respuesta -->
                <div class="answer" id="answerText"></div>

                <!-- Botones de acción -->
                <div class="buttons-top">
                    <button id="btnShowOptions" class="btn btn-pistas" onclick="game.questionModal.showOptions()">
                        Ver Pistas (50%)
                    </button>
                    <button class="btn" onclick="game.questionModal.showAnswer()">
                        Mostrar Respuesta
                    </button>
                    <button class="btn danger" onclick="game.questionModal.close()">
                        Cerrar
                    </button>
                </div>

                <!-- Jugadores -->
                <div class="players-area" id="playersArea"></div>

            </div>

            <!-- Presentadora -->
            <div class="presenter-container">
                <img src="./images/leyendo.png" class="presenter-img" alt="Presentadora">
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════
         MODAL EDITOR
    ═══════════════════════════════════ -->
    <div class="editor-modal" id="editorModal">
        <div class="editor-content">
            <h2 id="editorTitle">Editor de Juego</h2>
            <button class="add-category-btn" onclick="game.editor.addCategory()">+ Agregar Categoría</button>
            <div id="categoriesEditor"></div>
            <div class="editor-actions">
                <button class="btn btn-save" onclick="game.editor.save()">Guardar Cambios</button>
                <button class="btn danger btn-cancel" onclick="game.editor.close()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR PREGUNTA -->
    <div class="editor-modal" id="questionEditorModal">
        <div class="editor-content" id="questionEditorContent"></div>
    </div>

    <!-- ⚡ MODAL RONDA RELÁMPAGO -->
    <div class="modal" id="lightningModal"></div>

    <!-- AUDIO -->
    <audio id="rouletteTick" src="./audio/ruleta.mp3" preload="auto"></audio>
    <audio id="gameMusic" src="./audio/Música preguntas 1 - 5 (Quien Quiere ser millonario).mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
